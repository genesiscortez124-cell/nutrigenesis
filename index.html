<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control Nutricional y Despensa Inteligente</title>
  <!-- Tailwind CSS para un diseño limpio y moderno -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-emerald-600 text-white shadow-md py-4 px-6 flex justify-between items-center">
    <h1 class="text-xl font-bold flex items-center gap-2">🥗 NutriStock Asistente</h1>
    <div id="fechaHoy" class="text-sm bg-emerald-700 px-3 py-1 rounded-full"></div>
  </header>

  <!-- Contenedor Principal -->
  <main class="max-w-4xl w-full mx-auto p-4 flex-grow grid grid-cols-1 md:grid-cols-3 gap-6">
    
    <!-- Columna Izquierda: Mascota y Estado Rápido -->
    <div class="flex flex-col gap-6">
      <!-- Tarjeta de Mascota -->
      <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 text-center flex flex-col items-center">
        <div id="mascotaEmoji" onclick="reaccionarMascota()" class="text-6xl cursor-pointer transition-transform hover:scale-110 active:scale-95 select-none mb-2">🐰</div>
        <h3 id="mascotaNombre" class="font-bold text-lg text-slate-700">Bunny Nutri</h3>
        <p id="mascotaMensaje" class="text-xs text-slate-500 mt-1 italic min-h-[32px]">"¡Hola! Registra tus comidas y mantén el stock al día."</p>
        <div class="w-full bg-slate-100 rounded-full h-2.5 mt-4 overflow-hidden">
          <div id="barraAnimo" class="bg-emerald-500 h-2.5 w-3/4 transition-all duration-500"></div>
        </div>
        <span class="text-[10px] text-slate-400 mt-1">Ánimo de la mascota</span>
      </div>

      <!-- Pestañas de Navegación -->
      <div class="bg-white p-2 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-1">
        <button onclick="cambiarPestana('stock')" id="btnTabStock" class="w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm transition-colors bg-emerald-50 text-emerald-700">📦 Despensa y Stock</button>
        <button onclick="cambiarPestana('registro')" id="btnTabRegistro" class="w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm transition-colors text-slate-600 hover:bg-slate-50">🍽️ Registrar Comida</button>
        <button onclick="cambiarPestana('historial')" id="btnTabHistorial" class="w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm transition-colors text-slate-600 hover:bg-slate-50">📊 Historial y Reportes</button>
      </div>
    </div>

    <!-- Columna Derecha: Contenido Dinámico según la pestaña -->
    <div class="md:col-span-2 flex flex-col gap-6">

      <!-- SECCIÓN 1: STOCK Y DESPENSA -->
      <div id="seccionStock" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-4">
        <h2 class="text-lg font-bold text-slate-800 border-b pb-2">Gestión de Despensa e Insumos</h2>
        
        <!-- Formulario para Agregar Nuevo Ítem -->
        <form onsubmit="agregarItemStock(event)" class="bg-slate-50 p-4 rounded-xl border border-slate-200 grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div class="sm:col-span-2">
            <label class="block text-xs font-semibold text-slate-600 mb-1">Nombre del Ingrediente / Ítem</label>
            <input type="text" id="nuevoNombre" placeholder="Ej. Avena, Pechuga de Pollo, Leche..." required class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Cantidad</label>
            <input type="number" id="nuevaCantidad" step="any" placeholder="Ej. 1000" required class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Unidad</label>
            <select id="nuevaUnidad" class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
              <option value="g">Gramos (g)</option>
              <option value="ml">Mililitros (ml)</option>
              <option value="unidades">Unidades</option>
            </select>
          </div>
          <div class="sm:col-span-2">
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 rounded-lg text-sm transition-colors cursor-pointer">➕ Guardar Ítem en Despensa</button>
          </div>
        </form>

        <!-- Lista de Stock Actual -->
        <div>
          <h3 class="text-sm font-bold text-slate-700 mb-2">Inventario Actual Disponible:</h3>
          <div id="listaStock" class="flex flex-col gap-2 max-h-60 overflow-y-auto pr-1">
            <!-- Se llena por JS -->
          </div>
        </div>
      </div>

      <!-- SECCIÓN 2: REGISTRAR COMIDA -->
      <div id="seccionRegistro" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hidden flex-col gap-4">
        <h2 class="text-lg font-bold text-slate-800 border-b pb-2">Registrar Consumo y Descontar Stock</h2>
        
        <form onsubmit="registrarConsumo(event)" class="flex flex-col gap-4">
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Seleccionar Ingrediente del Stock</label>
            <select id="selectIngrediente" class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500" required>
              <!-- Se llena dinámicamente con la despensa actual -->
            </select>
          </div>
          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Cantidad Consumida</label>
              <input type="number" id="cantidadConsumo" step="any" placeholder="Ej. 150" required class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Calorías Aprox. (kcal)</label>
              <input type="number" id="caloriasConsumo" placeholder="Ej. 250" required class="w-full px-3 py-2 text-sm bg-white border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>
          </div>
          <button type="submit" class="bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2.5 rounded-lg text-sm transition-colors cursor-pointer">🍽️ Registrar y Descontar de Despensa</button>
        </form>
      </div>

      <!-- SECCIÓN 3: HISTORIAL Y REPORTES -->
      <div id="seccionHistorial" class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 hidden flex-col gap-4">
        <h2 class="text-lg font-bold text-slate-800 border-b pb-2">Historial de Consumo</h2>
        <div id="listaHistorial" class="flex flex-col gap-2 max-h-60 overflow-y-auto pr-1">
          <!-- Se llena por JS -->
        </div>
        <button onclick="copiarReporte()" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-medium py-2 rounded-lg transition-colors cursor-pointer">📋 Copiar Resumen al Portapapeles</button>
      </div>

    </div>
  </main>

  <!-- Script Lógico y Sincronización LocalStorage -->
  <script>
    // Estado inicial por defecto o recuperado de localStorage
    let stock = JSON.parse(localStorage.getItem('nutri_stock')) || [
      { id: 1, nombre: 'Pechuga de Pollo', cantidad: 1000, unidad: 'g' },
      { id: 2, nombre: 'Arroz', cantidad: 1500, unidad: 'g' },
      { id: 3, nombre: 'Leche Descremada', cantidad: 1000, unidad: 'ml' }
    ];

    let historial = JSON.parse(localStorage.getItem('nutri_historial')) || [];

    // Inicialización visual
    document.getElementById('fechaHoy').textContent = new Date().toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
    renderizarTodo();

    // Cambiar de pestañas
    function cambiarPestana(pestana) {
      document.getElementById('seccionStock').classList.add('hidden');
      document.getElementById('seccionRegistro').classList.add('hidden');
      document.getElementById('seccionHistorial').classList.add('hidden');

      document.getElementById('btnTabStock').className = "w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm transition-colors text-slate-600 hover:bg-slate-50";
      document.getElementById('btnTabRegistro').className = "w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm transition-colors text-slate-600 hover:bg-slate-50";
      document.getElementById('btnTabHistorial').className = "w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm transition-colors text-slate-600 hover:bg-slate-50";

      if (pestana === 'stock') {
        document.getElementById('seccionStock').classList.remove('hidden');
        document.getElementById('btnTabStock').className = "w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm transition-colors bg-emerald-50 text-emerald-700";
      } else if (pestana === 'registro') {
        document.getElementById('seccionRegistro').classList.remove('hidden');
        document.getElementById('btnTabRegistro').className = "w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm transition-colors bg-emerald-50 text-emerald-700";
        actualizarSelectIngredientes();
      } else if (pestana === 'historial') {
        document.getElementById('seccionHistorial').classList.remove('hidden');
        document.getElementById('btnTabHistorial').className = "w-full text-left px-4 py-2.5 rounded-xl font-medium text-sm transition-colors bg-emerald-50 text-emerald-700";
      }
    }

    // Agregar ítem a la despensa
    function agregarItemStock(event) {
      event.preventDefault();
      const nombre = document.getElementById('nuevoNombre').value.trim();
      const cantidad = parseFloat(document.getElementById('nuevaCantidad').value);
      const unidad = document.getElementById('nuevaUnidad').value;

      // Verificar si ya existe para sumar o crear nuevo
      const existente = stock.find(item => item.nombre.toLowerCase() === nombre.toLowerCase());
      if (existente) {
        existente.cantidad += cantidad;
      } else {
        stock.push({ id: Date.now(), nombre, cantidad, unidad });
      }

      guardarYActualizar();
      event.target.reset();
      actualizarMascota("¡Nuevo ingrediente agregado a la despensa con éxito! 🥕");
    }

    // Eliminar ítem del stock
    function eliminarStock(id) {
      stock = stock.filter(item => item.id !== id);
      guardarYActualizar();
    }

    // Registrar Consumo y descontar stock automáticamente
    function registrarConsumo(event) {
      event.preventDefault();
      const nombreItem = document.getElementById('selectIngrediente').value;
      const cantidadUsada = parseFloat(document.getElementById('cantidadConsumo').value);
      const calorias = parseFloat(document.getElementById('caloriasConsumo').value);

      // Buscar en el stock
      const itemStock = stock.find(i => i.nombre === nombreItem);
      if (!itemStock) return alert('Selecciona un ingrediente válido.');

      if (itemStock.cantidad < cantidadUsada) {
        alert(`⚠️ Advertencia: No tienes suficiente stock de ${itemStock.nombre}. Disponible: ${itemStock.cantidad} ${itemStock.unidad}`);
      }

      // Descontar automáticamente
      itemStock.cantidad = Math.max(0, itemStock.cantidad - cantidadUsada);

      // Agregar al historial
      historial.unshift({
        fecha: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
        nombre: nombreItem,
        cantidad: cantidadUsada,
        unidad: itemStock.unidad,
        calorias: calorias
      });

      guardarYActualizar();
      event.target.reset();
      actualizarMascota("¡Comida registrada y stock descontado correctamente! 🍽️✨");
      cambiarPestana('historial');
    }

    // Renderizar vistas
    function renderizarTodo() {
      // 1. Renderizar Lista Stock
      const contenedorStock = document.getElementById('listaStock');
      contenedorStock.innerHTML = '';
      if (stock.length === 0) {
        contenedorStock.innerHTML = '<p class="text-xs text-slate-400 italic">No hay elementos en la despensa.</p>';
      } else {
        stock.forEach(item => {
          contenedorStock.innerHTML += `
            <div class="flex justify-between items-center p-3 bg-slate-50 border border-slate-100 rounded-xl text-sm">
              <div>
                <span class="font-semibold text-slate-700">${item.nombre}</span>
                <span class="text-xs text-slate-500 ml-2">(${item.cantidad} ${item.unidad})</span>
              </div>
              <button onclick="eliminarStock(${item.id})" class="text-red-500 hover:text-red-700 text-xs font-medium cursor-pointer">Eliminar</button>
            </div>
          `;
        });
      }

      // 2. Renderizar Historial
      const contenedorHistorial = document.getElementById('listaHistorial');
      contenedorHistorial.innerHTML = '';
      if (historial.length === 0) {
        contenedorHistorial.innerHTML = '<p class="text-xs text-slate-400 italic">No hay registros de consumo aún.</p>';
      } else {
        historial.forEach(h => {
          contenedorHistorial.innerHTML += `
            <div class="p-3 bg-slate-50 border border-slate-100 rounded-xl text-sm flex justify-between items-center">
              <div>
                <p class="font-semibold text-slate-700">${h.nombre} (${h.cantidad} ${h.unidad})</p>
                <span class="text-xs text-slate-400">${h.fecha} • 🔥 ${h.calorias} kcal</span>
              </div>
            </div>
          `;
        });
      }
    }

    function actualizarSelectIngredientes() {
      const select = document.getElementById('selectIngrediente');
      select.innerHTML = '';
      stock.forEach(item => {
        select.innerHTML += `<option value="${item.nombre}">${item.nombre} (Disponibles: ${item.cantidad} ${item.unidad})</option>`;
      });
    }

    function guardarYActualizar() {
      localStorage.setItem('nutri_stock', JSON.stringify(stock));
      localStorage.setItem('nutri_historial', JSON.stringify(historial));
      renderizarTodo();
    }

    // Mascota interactiva
    const mensajesMascota = [
      "¡Sigue así! Estás cumpliendo tus metas nutricionales.",
      "Recuerda tomar suficiente agua durante el día 💧.",
      "¡Tu despensa luce genial y ordenada!",
      "¿Qué te parece cocinar algo rico hoy con lo que tienes?"
    ];

    function reaccionarMascota() {
      const mensajeAleatorio = mensajesMascota[Math.floor(Math.random() * mensajesMascota.length)];
      actualizarMascota(mensajeAleatorio);
    }

    function actualizarMascota(texto) {
      document.getElementById('mascotaMensaje').textContent = `"${texto}"`;
    }

    function copiarReporte() {
      let textoReporte = "📊 *Resumen Nutricional y Despensa* 🥗\n\n";
      textoReporte += "*Consumos recientes:*\n";
      historial.slice(0, 5).forEach(h => {
        textoReporte += `- ${h.nombre}: ${h.cantidad} ${h.unidad} (${h.calorias} kcal)\n`;
      });
      navigator.clipboard.writeText(textoReporte);
      alert('¡Resumen copiado al portapapeles!');
    }
  </script>
</body>
</html>
